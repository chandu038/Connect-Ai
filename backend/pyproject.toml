[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "chandu038", email = "chandudarapaneni093@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.1",
    "authlib>=1.9.5",
    "email-validator>=2.3.0",
    "fastapi>=0.162.0",
    "fastmcp>=4.1.6",
    "google-auth>=2.62.1",
    "httpx>=0.28.1",
    "itsdangerous>=2.2.0",
    "langchain>=1.4.9",
    "langchain-community>=0.4.2",
    "langchain-openai>=1.7.4",
    "langchain-postgres>=0.0.19",
    "langchain-text-splitters>=1.1.3",
    "openpyxl>=3.1.5",
    "pgvector>=0.3.6",
    "psycopg[binary]>=3.3.8",
    "pwdlib[argon2]>=0.3.1",
    "pydantic>=2.14.3",
    "pydantic-settings>=2.16.2",
    "pyjwt[crypto]>=2.15.1",
    "pypdf>=7.0.0",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.33",
    "sqlalchemy>=2.1.8",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
backend = "backend:main"

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"
[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "ruff>=0.17.4",
]
